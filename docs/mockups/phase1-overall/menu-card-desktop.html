<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Menu · One card · desktop</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="theme-c.css" />
  <link rel="stylesheet" href="plats-c.css" />
  <link rel="stylesheet" href="hud-mix.css" />
  <link rel="stylesheet" href="menus.css" />
</head>
<body class="desktop theme-c hud-a menu-card">
  <div class="sky">
  <div class="cloud c1">
    <span style="width:110px;height:42px;left:22px;top:20px"></span>
    <span style="width:58px;height:58px;left:8px;top:0"></span>
    <span style="width:64px;height:52px;left:62px;top:4px"></span>
  </div>
  <div class="cloud c2">
    <span style="width:150px;height:50px;left:28px;top:24px"></span>
    <span style="width:72px;height:72px;left:6px;top:0"></span>
    <span style="width:80px;height:64px;left:78px;top:6px"></span>
  </div>
  <div class="cloud c5">
    <span style="width:70px;height:28px;left:14px;top:12px"></span>
    <span style="width:36px;height:36px;left:0;top:0"></span>
    <span style="width:40px;height:32px;left:38px;top:4px"></span>
  </div>
</div>
  <div class="column">
    <div class="menu">
      <div class="wordmark">Jumpin' Jack</div>
      <div class="blurb">Jump to the bigger number before the pad gives way.</div>
      <div class="sheet">
        <div class="group">
          <h2>NUMBERS</h2>
          <div class="opts">
            <button class="opt">Whole</button>
            <button class="opt on">Decimals</button>
            <button class="opt">Fractions</button>
          </div>
        </div>
        <div class="group">
          <h2>DIFFICULTY</h2>
          <div class="opts">
            <button class="opt">Easy</button>
            <button class="opt on">Normal</button>
            <button class="opt">Hard</button>
          </div>
        </div>
        <div class="group">
          <h2>MODE</h2>
          <div class="opts">
            <button class="opt">Casual</button>
            <button class="opt on">Challenge</button>
            <button class="opt">Speed run</button>
          </div>
        </div>
</div>
      <button class="cta">Start Climb</button>
      <div class="note">Tap a platform · arrows / A D</div>
    </div>
    <img class="hero-menu" src="robot.png" alt="" />
    <div class="ground"></div>
  </div>
</body>
</html>
