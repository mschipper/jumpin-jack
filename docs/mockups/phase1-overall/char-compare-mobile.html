<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Robot vs Adventurer · mobile</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="theme-c.css" />
  <link rel="stylesheet" href="plats-c.css" />
  <link rel="stylesheet" href="hud-mix.css" />

  <style>
    .hero { display: none; }
    .fig {
      position: absolute;
      width: 78px;
      height: auto;
      transform: translateX(-50%);
      z-index: 12;
      pointer-events: none;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,.12));
      bottom: calc(46% + 52px);
    }
    .fig.robot { left: 26%; }
    .fig.adv {
      left: 74%;
      width: 92px;
      image-rendering: pixelated;
      bottom: calc(46% + 62px);
    }
    body.desktop .fig.robot { left: 27%; }
    body.desktop .fig.adv { left: 73%; }
    .caption {
      position: absolute;
      left: 0; right: 0;
      top: 108px;
      text-align: center;
      z-index: 30;
      font-family: "Fredoka", "Nunito", sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #fff;
      text-shadow: 0 2px 0 rgba(29,53,87,.35);
    }
  </style>
</head>
<body class="mobile theme-c hud-a">
  <div class="sky">
  <div class="cloud c1">
    <span style="width:110px;height:42px;left:22px;top:20px"></span>
    <span style="width:58px;height:58px;left:8px;top:0"></span>
    <span style="width:64px;height:52px;left:62px;top:4px"></span>
  </div>
  <div class="cloud c2">
    <span style="width:150px;height:50px;left:28px;top:24px"></span>
    <span style="width:72px;height:72px;left:6px;top:0"></span>
    <span style="width:80px;height:64px;left:78px;top:6px"></span>
    <span style="width:54px;height:48px;left:140px;top:16px"></span>
  </div>
  <div class="cloud c3">
    <span style="width:88px;height:34px;left:16px;top:16px"></span>
    <span style="width:44px;height:44px;left:0;top:0"></span>
    <span style="width:50px;height:40px;left:48px;top:4px"></span>
  </div>
  <div class="cloud c4">
    <span style="width:120px;height:44px;left:20px;top:18px"></span>
    <span style="width:60px;height:56px;left:4px;top:0"></span>
    <span style="width:66px;height:50px;left:70px;top:6px"></span>
  </div>
  <div class="cloud c5">
    <span style="width:70px;height:28px;left:14px;top:12px"></span>
    <span style="width:36px;height:36px;left:0;top:0"></span>
    <span style="width:40px;height:32px;left:38px;top:4px"></span>
  </div>
  <div class="bird" aria-hidden="true"></div>

  </div>
  <div class="column">
    <header class="hud">
      <div class="pill">Platforms <b>7</b></div>
      <div class="pill">Lv <b>1</b></div>
      <div class="pill">Best <b>24</b></div>
      <button class="pause" aria-label="Pause"><i></i><i></i></button>
    </header>
    <div class="timer"><i></i></div>
    <div class="hint">WHICH PLAYER?</div>
    <div class="caption">ORIGINAL ROBOT &nbsp;·&nbsp; ADVENTURER TILESHEET</div>
    <div class="world">
      <div class="plat sod left"><div class="num">Robot</div></div>
      <div class="plat sod right"><div class="num">Adventurer</div></div>
      <div class="plat sod stand"></div>
      <img class="fig robot" src="robot.png" alt="Foozle robot" />
      <img class="fig adv" src="../phase1-characters/r4-adventurer-idle.png" alt="Adventurer" />
    </div>
  </div>
</body>
</html>
