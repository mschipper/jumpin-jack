<!DOCTYPE html>
<html lang="en">

  <div class="cloud c3">

      <div class="pill">Lv <b>1</b></div>
      <div class="pill">Best <b>24</b></div>
      <button class="pause" aria-label="Pause"><i></i><i></i></button>
    </header>
    <div class="timer"><i></i></div>
    <div class="hint">JUMP TO THE BIGGER NUMBER</div>
    <div class="world">
      <div class="plat sod left"><div class="num">348</div></div>
