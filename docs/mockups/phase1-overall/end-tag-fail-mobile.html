<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>End · Giant tag · fail · mobile</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="theme-c.css" />
  <link rel="stylesheet" href="plats-c.css" />
  <link rel="stylesheet" href="hud-mix.css" />
  <link rel="stylesheet" href="menus.css" />
  <link rel="stylesheet" href="ends.css" />
</head>
<body class="mobile theme-c hud-a end-tag">
  <div class="sky">
  <div class="cloud c1">
    <span style="width:110px;height:42px;left:22px;top:20px"></span>
    <span style="width:58px;height:58px;left:8px;top:0"></span>
    <span style="width:64px;height:52px;left:62px;top:4px"></span>
  </div>
  <div class="cloud c2">
    <span style="width:150px;height:50px;left:28px;top:24px"></span>
    <span style="width:72px;height:72px;left:6px;top:0"></span>
    <span style="width:80px;height:64px;left:78px;top:6px"></span>
  </div>
  <div class="cloud c4">
    <span style="width:120px;height:44px;left:20px;top:18px"></span>
    <span style="width:60px;height:56px;left:4px;top:0"></span>
  </div>
</div>
  <div class="column">
    <header class="hud">
      <div class="pill">Platforms <b>12</b></div>
      <div class="pill">Lv <b>1</b></div>
      <div class="pill">Best <b>12</b></div>
      <button class="pause" aria-label="Pause"><i></i><i></i></button>
    </header>
    <div class="timer"><i></i></div>
    <div class="world">
      <div class="plat sod left" style="bottom:48%"><div class="num">348</div></div>
      <div class="plat sod right" style="bottom:48%"><div class="num">384</div></div>
      <div class="plat sod stand"></div>

      <img class="hero-fall" src="robot.png" alt="" />
    </div>
    
    <div class="end">
      <h1>You fell!</h1>
      <div class="score"><b>12</b> platforms</div>
      <div class="record">NEW RECORD</div>
      <div class="best">Best 12</div>
      <button class="cta">Climb again</button>
      <div class="alt">Change setup</div>
    </div>
  </div>
</body>
</html>
