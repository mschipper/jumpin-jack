<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Numbers · Stamp · mobile</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="theme-c.css" />
  <link rel="stylesheet" href="plats-c.css" />
  <link rel="stylesheet" href="hud-mix.css" />
  <link rel="stylesheet" href="nums.css" />
</head>
<body class="mobile theme-c hud-a nums-stamp">
  <div class="sky">
  <div class="cloud c1">
    <span style="width:110px;height:42px;left:22px;top:20px"></span>
    <span style="width:58px;height:58px;left:8px;top:0"></span>
    <span style="width:64px;height:52px;left:62px;top:4px"></span>
  </div>
  <div class="cloud c2">
    <span style="width:150px;height:50px;left:28px;top:24px"></span>
    <span style="width:72px;height:72px;left:6px;top:0"></span>
    <span style="width:80px;height:64px;left:78px;top:6px"></span>
  </div>
  <div class="cloud c4">
    <span style="width:120px;height:44px;left:20px;top:18px"></span>
    <span style="width:60px;height:56px;left:4px;top:0"></span>
    <span style="width:66px;height:50px;left:70px;top:6px"></span>
  </div>
</div>
  <div class="column">
    <header class="hud">
      <div class="pill">Platforms <b>7</b></div>
      <div class="pill">Lv <b>1</b></div>
      <div class="pill">Best <b>24</b></div>
      <button class="pause" aria-label="Pause"><i></i><i></i></button>
    </header>
    <div class="timer"><i></i></div>
    <div class="board">
      <div class="row">
        <div class="label">WHOLE</div>
        <div class="plat sod left"><div class="num wide">999,999</div></div>
        <div class="plat sod right"><div class="num wide">100,000</div></div>
      </div>
      <div class="row">
        <div class="label">DECIMAL</div>
        <div class="plat sod left"><div class="num">0.89</div></div>
        <div class="plat sod right"><div class="num">0.9</div></div>
      </div>
      <div class="row">
        <div class="label">FRACTION</div>
        <div class="plat sod left"><div class="num frac"><span>3</span><i class="bar"></i><span>4</span></div></div>
        <div class="plat sod right"><div class="num frac"><span>2</span><i class="bar"></i><span>3</span></div></div>
      </div>

    </div>
  </div>
</body>
</html>
